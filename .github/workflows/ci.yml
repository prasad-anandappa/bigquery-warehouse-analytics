name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlglot
      - name: Parse-validate all BigQuery SQL + loader plan smoke test
        run: python3 tests/validate_sql.py
